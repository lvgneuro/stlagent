[project]
name = "tg-echo-bot"
version = "0.1.0"
description = "Simple echo bot with aiogram 3.27"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.27",
    "python-dotenv>=1.0",
    "anthropic>=0.25",
    "tavily-python>=0.7.24",
    "duckduckgo-search>=8.1.1",
    "sqlalchemy>=2.0.49",
    "aiosqlite>=0.22.1",
    "aiohttp>=3.9",
    "gunicorn>=21.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "pdfplumber>=0.11.9",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]
